<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ラジオトーク</title>
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
  <header class="hero">
    <div class="mic">🎙️</div>
    <h1>ラジオトーク</h1>
    <p>建設業に役立つ知識を、音声でわかりやすく</p>
  </header>

  <main class="container">
    <section class="theme-card">
      <span>今回のテーマ</span>
      <h2 id="theme-title">読み込み中...</h2>
    </section>

    <nav class="tabs" role="tablist" aria-label="言語を選択">
      <button class="tab-button active" data-tab="ja" role="tab" aria-selected="true">JP 日本語</button>
      <button class="tab-button" data-tab="vi" role="tab" aria-selected="false">VN Tiếng Việt</button>
      <button class="tab-button" data-tab="id" role="tab" aria-selected="false">ID Indonesia</button>
    </nav>

    <section class="content-card">
      <article class="tab-panel active" data-panel="ja">

    <h3>JP 日本語</h3>

    <section class="section-block">

        <details>

            <summary>📄 原稿を見る</summary>

            <div class="script-box"
                 data-text="text/japanese.txt">
                読み込み中...
            </div>

        </details>

    </section>

    <section class="section-block">

       <h4>🎧 音声</h4>

<div class="audio-card">

    <audio
        controls
        preload="metadata"
        src="audio/japanese.m4a?v=1">
    </audio>

</div>
    </section>

</article>

      <article class="tab-panel" data-panel="vi" hidden>

    <h3>VN Tiếng Việt</h3>

    <section class="section-block">

        <details>

            <summary>📄 Bản thảo</summary>

            <div class="script-box"
                 data-text="text/vietnamese.txt">
                Đang tải...
            </div>

        </details>

    </section>

    <section class="section-block">

        <h4>🎧 Âm thanh</h4>

<div class="audio-card">

        <audio 
            controls 
            preload="metadata"
            src="audio/vietnamese.mp3?v=1">
        </audio>

</div>

    </section>

</article>

     <article class="tab-panel" data-panel="id" hidden>

    <h3>ID Bahasa Indonesia</h3>

    <section class="section-block">

        <details>

            <summary>📄 Naskah</summary>

            <div class="script-box"
                 data-text="text/indonesian.txt">
                Memuat...
            </div>

        </details>

    </section>

 <section class="section-block">

    <h4>🎧 Audio</h4>

    <div class="audio-card">

        <audio 
            controls 
            preload="metadata"
            src="audio/indonesian.mp3?v=1">
        </audio>

    </div>

</section>

</article>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
